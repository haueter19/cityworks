[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cityworks"
version = "2.0.0"
description = "Cityworks API client and automation tools for parking infrastructure management"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Daniel Haueter", email = "dhaueter@cityofmadison.com"}
]
keywords = ["cityworks", "api", "gis", "work-order", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies
dependencies = [
    "requests>=2.28.1",
    "pandas>=1.5.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=4.0.0",  # Database connectivity
    "python-dotenv>=1.0.0",  # Environment variable management
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

# PDF/attachment handling
attachments = [
    "pdf2image>=1.16.0",
    "Pillow>=9.0.0",
]

# GIS operations
gis = [
    "geopandas>=0.12.0",
    "shapely>=2.0.0",
]

# Web/API development
api = [
    "pydantic>=2.0.0",
]

# Full installation with all extras
all = [
    "cityworks[dev,attachments,gis,api]",
]

[project.urls]
Homepage = "https://github.com/haueter19/cityworks"
Documentation = "https://github.com/haueter19/cityworks/wiki"
Repository = "https://github.com/haueter19/cityworks"
Issues = "https://github.com/haueter19/cityworks/issues"

[project.scripts]
# Optional CLI commands
cityworks = "cityworks.cli:main"

[tool.setuptools]
packages = ["cityworks", "cityworks.api", "cityworks.client", "cityworks.database", "cityworks.gis", "cityworks.utils", "cityworks.workflows"]

[tool.setuptools.package-data]
cityworks = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration (modern, fast linter)
[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "pdf2image.*",
    "arcpy.*",
    "geopandas.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=cityworks",
    "--cov-report=html",
    "--cov-report=term-missing",
]